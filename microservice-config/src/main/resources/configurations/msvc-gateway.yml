server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: msvc-student
          uri: lb://MSVC-STUDENT # Usar lb:// para balanceo de carga
          predicates:
            - Path=/api/student/**
        - id: msvc-course
          uri: lb://MSVC-COURSE
          predicates:
            - Path=/api/course/**

eureka:
  client:
    register-with-eureka: true # CAMBIAR A TRUE
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/